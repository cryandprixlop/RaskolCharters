# ===== RaskolCharters: королевские грамоты =====
item:
  name: "&6Жалованная грамота"
  flavor:
    - "&7Сим удостоверяется, что держатель сего документа"
    - "&7находится под покровительством короны и вправе"
    - "&7получать жалование из казны государства."

# Срок действия грамоты (в днях): /gramota give <игрок> <сумма> <day|week|month> <частота>
periods:
  day: 1
  week: 7
  month: 30

# Частота выплат (в секундах)
frequencies:
  hour: 3600
  day: 86400
  week: 604800

# Казна: источник выплат (Этап 2)
treasury:
  mode: NATION_BANK        # NATION_BANK (банк нации Towny) | ACCOUNT (оффлайн-аккаунт)
  account-prefix: "nation-"

# Держатель должен быть подданным нации, выдавшей грамоту
require-same-nation: true

# Грамота не выпадает при смерти
keep-on-death: true
